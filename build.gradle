// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// http://www.gradle.org/docs/current/dsl/org.gradle.api.plugins.ExtraPropertiesExtension.html
project.ext {
    ANDROID_BUILD_SDK_VERSION = 36

    ANDROID_BUILD_MIN_SDK_VERSION = 14
    ANDROID_BUILD_TARGET_SDK_VERSION = 28

    // Google Stuffs
    supportPackageVersion = "28.0.0"

    // EventBus
    eventBusVersion = "2.4.0"

    // Timber
    timberVersion = "2.5.1"
    // http://tools.android.com/tech-docs/new-build-system/tips
    preDexLibs = !project.hasProperty('disablePreDex')
}