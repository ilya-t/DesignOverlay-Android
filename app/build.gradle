apply plugin: 'com.android.application'

configurations.all {
    // check for updates every build for changing modules
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

android {
    namespace "com.ms_square.android.design.overlay"
    compileSdkVersion project.ANDROID_BUILD_SDK_VERSION

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    //  Gets the revision number from the Git
    def getRevision = { ->
        try {
            def stdout = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', 'HEAD'
                standardOutput = stdout
            }
            // pick first six characters
            return stdout.toString().trim().substring(0, 6)
        } catch (Exception e) {
            return ""
        }
    }

    defaultConfig {
        applicationId "com.ms_square.android.design.overlay"
        minSdkVersion project.ANDROID_BUILD_MIN_SDK_VERSION
        targetSdkVersion project.ANDROID_BUILD_TARGET_SDK_VERSION
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        release {
            def Properties keyProps = new Properties()
            // double check if keystore.properties exists to avoid exception
            if (file("../keystore.properties").exists()) {
                keyProps.load(new FileInputStream(file('../keystore.properties')))
            }
            storeFile keyProps["storeFile"] != null ? file(keyProps["storeFile"]) : null
            storePassword keyProps["storePassword"]
            keyAlias keyProps["keyAlias"]
            keyPassword keyProps["keyPassword"]
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BUILD_NUMBER", "\"" + getRevision() + "\""

            minifyEnabled false
        }
        release {
            buildConfigField "String", "BUILD_NUMBER", "\"" + getRevision() + "(R)\""

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // check if keystore.properties exists in the root
            if (file("../keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Support libraries
    implementation "com.android.support:support-v4:${supportPackageVersion}"
    implementation "com.android.support:appcompat-v7:${supportPackageVersion}"
    // to support annotations such as @NonNull
    implementation "com.android.support:support-annotations:${supportPackageVersion}"

    // EventBus
    implementation "de.greenrobot:eventbus:${project.eventBusVersion}"

    // Timber for logging
    implementation "com.jakewharton.timber:timber:${project.timberVersion}"
}